[project]
name = "zensical-updates"
version = "0.1.7"
description = "Generate a dated Updates (blog) section for zensical sites as plain Markdown"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
authors = [{ name = "Ivan Anishchuk", email = "ivan@ivananishchuk.net" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0",
    "pyyaml>=6.0.3",
    # 0.0.72 moved URL resolution out of the Python render() the feed calls.
    "zensical>=0.0.72,<0.1.0",
    "feedgen>=1.0,<2.0",
    "lxml>=6.1.3",
]

[project.urls]
Homepage = "https://github.com/IvanAnishchuk/zensical-updates"
Repository = "https://github.com/IvanAnishchuk/zensical-updates"
Documentation = "https://IvanAnishchuk.github.io/zensical-updates/"
Issues = "https://github.com/IvanAnishchuk/zensical-updates/issues"
Changelog = "https://github.com/IvanAnishchuk/zensical-updates/blob/main/CHANGELOG.md"
Security = "https://github.com/IvanAnishchuk/zensical-updates/blob/main/SECURITY.md"

[project.scripts]
zensical-updates = "zensical_updates.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=2.4",
    "ty>=0.0.92",
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7",
    "zizmor>=1.31.1",
    "types-pyyaml>=6.0.12.20260906",
    "zensical>=0.0.72",
    "feedparser>=6.0.14",
    "types-lxml>=2026.2.16",
]
docs = [
    "zensical>=0.0.72",
    "mkdocstrings-python>=2.0.10",
    "mkdocs-typer2[zensical]>=0.4.1",
]

[build-system]
# >=1.27 for PEP 639 license-expression support; floor kept current by dependabot.
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zensical_updates"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE.md",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "BLE",   # flake8-blind-except
    "TRY",   # tryceratops
    "RUF",   # ruff-specific
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "C4",    # flake8-comprehensions
    "PL",    # pylint
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is fine in tests
    "S603",    # subprocess with validated input in fixtures
    "S607",    # partial executable path in test setup
    "BLE001",  # broad Exception in test fixtures
    "T20",     # print is useful in test debugging
]

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 8
max-branches = 15
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["zensical_updates"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
extra_checks = true
strict_bytes = true
local_partial_types = true
disallow_any_unimported = true

[tool.basedpyright]
pythonVersion = "3.14"
include = ["src", "tests"]
# "recommended" is basedpyright's strictest profile. It flags under-typed spots
# (Any from untyped feedgen/feedparser, unused call results) as warnings, not
# errors, so CI stays green while the gaps stay visible to pay down with casts and
# stubs over time. Don't silence the rules; pay down the warnings instead.
typeCheckingMode = "recommended"
reportMissingTypeStubs = false

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=zensical_updates",
    "--cov-config=pyproject.toml",
    "--cov-report=term-missing",
    "--cov-report=html:.reports/test/htmlcov",
    "--cov-report=xml:.reports/test/coverage.xml",
    "--junitxml=.reports/test/test-results.xml",
    "-ra",
]
junit_family = "xunit2"
junit_logging = "all"
junit_log_passing_tests = false

[tool.coverage.run]
source_pkgs = ["zensical_updates"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if __name__",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]

[[tool.mypy.overrides]]
module = ["feedgen.*", "feedparser"]
ignore_missing_imports = true
