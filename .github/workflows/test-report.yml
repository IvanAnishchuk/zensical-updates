name: Test report

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions: {}

# Must match the primary Python version in test.yml matrix
env:
  PRIMARY_PYTHON: "3.14"

jobs:
  report:
    name: Publish test results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-results-${{ env.PRIMARY_PYTHON }}
          path: .reports/test/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish test results (PR annotations)
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: .reports/test/test-results.xml
          check_name: "Pytest report (${{ env.PRIMARY_PYTHON }})"
          comment_mode: always
          compare_to_earlier_commit: true
          event_file: ${{ github.event_path }}
          event_name: ${{ github.event.workflow_run.event }}
          commit: ${{ github.event.workflow_run.head_sha }}
