name: Type check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

env:
  REPORTS_DIR: .reports

jobs:
  typecheck:
    name: Type check (${{ matrix.checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Trimmed by the post-generation hook to the enabled checkers.
        checker: [mypy, ty, basedpyright]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --frozen --dev

      - name: Prepare reports directory
        run: mkdir -p "${REPORTS_DIR}/typecheck"

      - name: Run ${{ matrix.checker }}
        env:
          CHECKER: ${{ matrix.checker }}
        run: |
          set -o pipefail
          case "${CHECKER}" in
            mypy)         uv run mypy ;;
            ty)           uv run ty check ;;
            # basedpyright runs its `recommended` profile for the insights, but it
            # exits non-zero on warnings (a known pyright behavior) and we keep those
            # under-typed warnings visible rather than baselining them. So it is
            # advisory: log it, never fail the gate. mypy and ty do the gating.
            basedpyright) uv run basedpyright || true ;;
            *)            echo "unknown checker: ${CHECKER}" >&2; exit 1 ;;
          esac 2>&1 | tee "${REPORTS_DIR}/typecheck/${CHECKER}.log"

      - name: Upload ${{ matrix.checker }} log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typecheck-${{ matrix.checker }}-log
          path: .reports/typecheck/
          retention-days: 14

  # Aggregate the (dynamically trimmed) checker matrix into one stable
  # status context. Branch protection requires "Type check", which stays
  # valid no matter how many matrix legs the post-gen hook leaves enabled.
  typecheck-gate:
    name: Type check
    needs: [typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Require the type-check matrix to pass
        env:
          RESULT: ${{ needs.typecheck.result }}
        run: |
          [ "$RESULT" = success ] || { echo "type-check matrix: $RESULT"; exit 1; }
